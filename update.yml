---
- name: Conditional Unattended Upgrades
  hosts: all
  become: true
  tasks:
    - name: Check if unattended-upgrades is installed
      ansible.builtin.stat:
        path: /usr/bin/unattended-upgrade
      register: u_upgrade_bin

    - name: Run unattended-upgrades if found
      ansible.builtin.command: unattended-upgrade -v
      when: u_upgrade_bin.stat.exists
      register: upgrade_result
      changed_when: "'No packages found that can be upgraded' not in upgrade_result.stderr"

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot if required
      ansible.builtin.reboot:
        msg: "Rebooting after unattended upgrades"
      when: reboot_required_file.stat.exists
